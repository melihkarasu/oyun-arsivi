<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyun Keşif Kütüphanesi & Arşivi</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fa520f' stroke='%2344403c' stroke-width='1.5'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,BlinkMacSystemFont,Inter,sans-serif' font-weight='800' font-size='13' letter-spacing='-0.5'%3EMK%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/mistral-theme.css">
  <style>
    :root {
      --mistral-ink: #1c1917;
      --mistral-slate: #78716c;
      --mistral-stone: #a8a29e;
      --mistral-hairline: #e7e5e4;
      --mistral-cream: #f5f5f4;
      --mistral-cream-deeper: #e7e5e4;
      --mistral-cream-light: #fafaf9;
      --mistral-beige-deep: #d6d3d1;
      --mistral-orange: #fa520f;
      --mistral-orange-deep: #e04400;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #fafaf9; color: var(--mistral-ink); }
    h1, h2, h3, h4, .font-editorial { font-family: 'Newsreader', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .bg-mistral-cream { background-color: var(--mistral-cream); }
    .bg-mistral-cream-deeper { background-color: var(--mistral-cream-deeper); }
    .bg-mistral-cream-light { background-color: var(--mistral-cream-light); }
    .text-mistral-ink { color: var(--mistral-ink); }
    .text-mistral-slate { color: var(--mistral-slate); }
    .text-mistral-stone { color: var(--mistral-stone); }
    .text-mistral-orange { color: var(--mistral-orange); }
    .bg-mistral-orange { background-color: var(--mistral-orange); }
    .bg-mistral-orange-deep { background-color: var(--mistral-orange-deep); }
    .hover\\:bg-mistral-orange-deep:hover { background-color: var(--mistral-orange-deep) !important; }
    .hover\\:bg-mistral-orange:hover { background-color: var(--mistral-orange) !important; }
    .border-mistral-hairline { border-color: var(--mistral-hairline); }
    .border-mistral-beige-deep { border-color: var(--mistral-beige-deep); }
    button[class*="bg-mistral-orange"] { color: #ffffff !important; }
  </style>
</head>
<body class="p-4 sm:p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Üst Başlık & Navigasyon -->
      <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-3">
            
          </div>
          <h1 class="text-3xl sm:text-4xl font-normal font-editorial tracking-tight mt-1.5 text-mistral-ink flex items-center gap-2">
            <span>🕹️</span> Oyun Keşif Kütüphanesi & Arşivi
          </h1>
          <p class="text-mistral-slate text-sm mt-0.5 font-normal">
            FreeToGame ve açık oyun veritabanı ile PC ve tarayıcı tabanlı yüzlerce oyun, tür filtreleri ve detaylar.
          </p>
        </div>

        <div class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-mistral-hairline text-xs text-mistral-ink shadow-xs">
          <span class="text-mistral-orange font-bold text-sm" id="game-count-badge">Yükleniyor...</span>
          <span class="text-mistral-slate font-medium">Oyun Listelendi</span>
        </div>
      </div>

      <!-- ARAMA VE TÜR FİLTRELERİ -->
      <div class="p-6 rounded-2xl bg-white border border-mistral-hairline shadow-sm mb-8 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-center">
          <div class="sm:col-span-8 relative">
            <input 
              type="text" 
              id="game-search" 
              placeholder="Oyun adı veya açıklama ara (örn: Overwatch, Tarisland, Genshin, PUBG)..." 
              onkeydown="if(event.key==='Enter') loadGames()"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white border border-mistral-hairline text-sm text-mistral-ink placeholder:text-mistral-stone focus:outline-none focus:border-mistral-orange transition">
            <span class="absolute left-3.5 top-3 text-mistral-stone text-sm">🔍</span>
          </div>
          <div class="sm:col-span-4 flex gap-2">
            <select id="game-genre" onchange="loadGames()" class="w-full px-3 py-2.5 rounded-lg bg-white border border-mistral-hairline text-sm text-mistral-ink focus:outline-none focus:border-mistral-orange transition">
              <option value="all">Tüm Türler</option>
              <option value="mmorpg">MMORPG</option>
              <option value="shooter">Nişancı (Shooter / FPS)</option>
              <option value="moba">MOBA</option>
              <option value="anime">Anime</option>
              <option value="battle-royale">Battle Royale</option>
              <option value="strategy">Strateji</option>
              <option value="fantasy">Fantastik</option>
              <option value="racing">Yarış</option>
            </select>
            <button 
              onclick="loadGames()" 
              class="px-4 py-2.5 rounded-md bg-mistral-orange hover:bg-mistral-orange-deep text-white text-xs font-medium transition shadow-xs shrink-0 flex items-center justify-center">
              Filtrele
            </button>
          </div>
        </div>
      </div>

      <!-- OYUN KARTLARI IZGARASI -->
      <div id="games-loading" class="py-16 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-mistral-cream text-mistral-ink border border-mistral-beige-deep text-xs font-semibold">
          <span class="w-2.5 h-2.5 rounded-full bg-mistral-orange animate-ping"></span>
          <span>Oyun kütüphanesi taranıyor...</span>
        </div>
      </div>

      <div id="games-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-16">
        <!-- JS ile çizilir -->
      </div>
  </div>

  <footer class="mt-16 text-center text-xs text-mistral-stone border-t border-mistral-hairline pt-6">
    <p>Açık Kaynak Standalone Sürüm • Veriler: <a href="https://www.freetogame.com/api" target="_blank" rel="noopener" class="underline hover:text-mistral-ink">FreeToGame API</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
